site_name: sRNA-IMP pipeline
site_url: https://genomeanalysislcsb.github.io/sRNA-IMP/
repo_url: https://github.com/genomeanalysislcsb/sRNA-IMP
repo_name: genomeanalysislcsb/sRNA-IMP
edit_uri: edit/main/docs/
site_description: Small RNA analysis of gut microbiome samples - intracellular and extracellular sRNA-seq
site_author: LCSB BioCore
copyright: LCSB BioCore, University of Luxembourg

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

nav:
  - Home: index.md
  - Getting started:
      - Installation & databases: installation.md
      - Input & sample sheet: inputs.md
      - Running the pipeline: running.md
  - Workflow:
      - Overview of the steps: workflow.md
      - Read definitions : definitions.md
      - Classification hierarchies: classification.md
  - Cohort analysis: cohort.md
  - Reference:
      - Output files: outputs.md
      - Configuration parameters: configuration.md
  - Quality control & troubleshooting: qc.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
